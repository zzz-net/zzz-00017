[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-pack"
version = "0.1.0"
description = "本地合同附件打包交付 CLI - 按 CSV 清单和配置整理合同文件并打包交付"
requires-python = ">=3.9"
authors = [{ name = "Contract Pack" }]
dependencies = [
    "click>=8.1.0",
    "PyYAML>=6.0",
    "rich>=13.0.0",
]

[project.scripts]
contract-pack = "contract_pack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
